services:
  app:
    build: .
    container_name: simly-backend
    ports:
      - "8085:8080" # Map host 8085 to container 8080 (Hardcoded)
    env_file:
      - .env
    environment:
      - PORT=8080 # Override PORT to match internal container port
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: simly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
